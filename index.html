<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Anteprima del tema Shopify F205. Bozza, non indicizzata.">
<meta name="theme-color" content="#101012">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter+Tight:wght@400;500;600;700&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 fill=%22%23101012%22/%3E%3Ctext x=%2232%22 y=%2242%22 text-anchor=%22middle%22 font-family=%22Arial Narrow,Arial%22 font-weight=%22bold%22 font-size=%2226%22 fill=%22%23F5F3EE%22%3EF205%3C/text%3E%3C/svg%3E">
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Negozio F205</title>
<style>
:root{
  --ink:#101012; --paper:#F5F3EE; --paper-2:#EAE6DD; --line:#D3CEC2; --line-2:#B9B2A2;
  --muted:#6E695F; --rosso:#C8262A; --blu:#16307A; --oro:#D9A425; --white:#fff;
  --maxw:1400px; --gut:clamp(16px,3.4vw,44px);
  --f-disp:"Anton","Arial Narrow",Impact,sans-serif;
  --f-body:"Inter Tight","Helvetica Neue",Arial,sans-serif;
  --s--1:clamp(11px,.72rem,12px); --s-0:clamp(14px,.95rem,16px); --s-1:clamp(17px,1.2vw,20px);
  --s-2:clamp(22px,2vw,30px); --s-3:clamp(28px,3.4vw,50px); --s-4:clamp(40px,6.6vw,96px);
  --s-5:clamp(54px,12vw,190px);
  --ease:cubic-bezier(.22,.61,.36,1);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);
  font-size:var(--s-0);line-height:1.55;font-weight:420;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img,svg{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
h1,h2,h3,p,figure,blockquote,dl,dd{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--rosso);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.wrap{width:100%;max-width:var(--maxw);margin-inline:auto;padding-inline:var(--gut)}
.sec{padding-block:clamp(44px,6.5vw,104px)}
.sec--t{padding-block:clamp(30px,4vw,60px)}
.disp{font-family:var(--f-disp);font-weight:400;line-height:1.05;letter-spacing:-.005em;text-transform:uppercase;text-wrap:balance}
.d5{font-size:var(--s-5);line-height:1} .d4{font-size:var(--s-4)} .d3{font-size:var(--s-3)} .d2{font-size:var(--s-2)}
.lab{font-size:var(--s--1);font-weight:600;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);display:block}
.lab--ink{color:var(--ink)} .lab--pale{color:#9C968A}
.lead{font-size:var(--s-1);line-height:1.45;max-width:60ch}
.mut{color:var(--muted)} .mt{margin-top:clamp(16px,2.2vw,30px)}
.tnum{font-variant-numeric:tabular-nums}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* grid and flex children must be allowed to shrink, or long words blow the page out */
.nl__in>*,.codice__in>*,.pdp>*,.grid>*,.live>*,.revs>*,.ftr__top>*,.hdr__in>*,.bar>*,.row>*,.gal>*{min-width:0}
.field{max-width:100%}
.field input{width:100%;min-width:0}
.field button{padding:0 1.15em;white-space:nowrap}
.hdr__act,.hdr__nav{min-width:0;flex-wrap:wrap}
.card__t,.rev p,.ftr li,.crumb{overflow-wrap:anywhere}
.chrome{background:#191A1C;color:#CFCABE;font-size:12px;letter-spacing:.05em;padding:9px var(--gut);
  display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;text-align:center}
.chrome b{color:#fff;font-weight:600}
.chrome .dot{width:6px;height:6px;background:var(--rosso);border-radius:50%;flex:none}

/* prova sociale: la valutazione del negozio (stessa societa'), dichiarata come tale */
.proof{background:var(--paper-2);border-bottom:1px solid var(--line)}
.proof__in{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 18px;
  padding-block:10px;text-align:center;font-size:var(--s--1)}
.proof__i{display:flex;align-items:center;gap:.5em;white-space:nowrap}
.proof .stars{color:var(--oro);letter-spacing:.08em}
.proof b{font-weight:700}
.proof a{border-bottom:1px solid var(--line-2)}

/* barra acquisto fissa: misurato, su 390px il pulsante stava a 1117px dall'alto */
.buybar{position:fixed;left:0;right:0;bottom:0;z-index:70;display:none;background:var(--paper);
  border-top:1px solid var(--line);padding:10px var(--gut) calc(10px + env(safe-area-inset-bottom));
  box-shadow:0 -6px 22px rgba(16,16,18,.12)}
.buybar__in{display:flex;align-items:center;gap:12px}
.buybar__p{display:grid;gap:2px;min-width:0}
.buybar__t{font-size:var(--s--1);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.buybar__pr{font-size:var(--s-1);font-weight:600;line-height:1}
.buybar .btn{flex:1;min-height:48px}
body.has-buybar{padding-bottom:84px}
@media (max-width:920px){.buybar.on{display:block}}

/* aree tattili: minimo 44px (linea guida Apple e Google) */
.hdr__act a,.hdr__act button,.hdr__nav a,.burger{min-height:44px;display:inline-flex;align-items:center}
.langs{display:inline-flex;align-items:center;gap:2px}
.btn{min-height:48px}
.link-u{min-height:44px;display:inline-flex;align-items:center}
.faq summary,.acc summary{min-height:48px}
.opt__r button{min-height:44px}
.qty button{width:44px;height:44px}
.chips button{min-height:44px}
.ftr li a,.proof a,.pickup a,.crumb a{min-height:44px;display:inline-flex;align-items:center}
.ftr li{margin-bottom:2px}

/* ritiro in negozio, per chi passa davanti */
.pickup{border:1px solid var(--line);background:var(--white);padding:clamp(16px,2.2vw,24px);display:grid;gap:8px}
.pickup__row{display:flex;gap:.6em;align-items:baseline}
.pickup__row::before{content:"—";color:var(--rosso)}
.hero__meta{font-size:var(--s--1);color:#C9C4BA;letter-spacing:.06em;text-transform:uppercase;font-weight:600}

.cross{width:1em;height:1em;display:inline-block;vertical-align:-.08em;position:relative;flex:none}
.cross::before,.cross::after{content:"";position:absolute;background:var(--rosso)}
.cross::before{left:calc(50% - .14em);top:0;width:.28em;height:100%}
.cross::after{top:calc(50% - .14em);left:0;height:.28em;width:100%}
.cross--w::before,.cross--w::after{background:currentColor}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6em;background:var(--ink);
  color:var(--paper);border:1px solid var(--ink);padding:.95em 1.7em;font-size:var(--s--1);font-weight:700;
  text-transform:uppercase;letter-spacing:.14em;line-height:1;
  transition:transform .18s var(--ease),background .18s var(--ease),color .18s var(--ease)}
.btn:hover{transform:translateY(-2px)}
.btn--light{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.btn--ghost{background:transparent;color:var(--paper);border-color:rgba(245,243,238,.5)}
.btn--ghost:hover{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.btn--full{width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}
.link-u{display:inline-block;font-size:var(--s--1);font-weight:600;text-transform:uppercase;
  letter-spacing:.14em;border-bottom:1px solid currentColor;padding-bottom:.25em}

.ann{background:var(--ink);color:var(--paper);font-size:var(--s--1);letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.ann__in{display:flex;align-items:center;justify-content:center;gap:.8em;min-height:38px;text-align:center}
.hdr{position:sticky;top:0;z-index:40;background:var(--paper);border-bottom:1px solid var(--line)}
.hdr__in{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;min-height:66px}
.hdr__nav{display:flex;gap:clamp(12px,1.6vw,28px);align-items:center}
.hdr__nav a{font-size:var(--s--1);font-weight:600;text-transform:uppercase;letter-spacing:.13em;
  padding-block:6px;border-bottom:1px solid transparent}
.hdr__nav a:hover,.hdr__nav a.on{border-bottom-color:var(--rosso)}
.hdr__mark{justify-self:center;font-family:var(--f-disp);font-size:clamp(24px,3vw,34px);line-height:1;letter-spacing:.02em}
.hdr__act{display:flex;gap:12px;align-items:center;justify-self:end}
.hdr__act a,.hdr__act button{font-size:var(--s--1);font-weight:600;text-transform:uppercase;letter-spacing:.12em}
.langs button{color:var(--muted)} .langs button.on{color:var(--ink);border-bottom:1px solid var(--rosso)}
.count{display:inline-grid;place-items:center;min-width:1.5em;height:1.5em;padding:0 .35em;background:var(--rosso);
  color:#fff;border-radius:99px;font-size:10px;font-weight:700;margin-left:.4em}
.burger{display:none}
@media (max-width:940px){.hdr__nav{display:none}.hdr__in{grid-template-columns:auto 1fr auto}
  .hdr__mark{justify-self:start}.burger{display:block}}
.mnav{position:fixed;inset:0;z-index:80;background:var(--paper);padding:22px var(--gut);
  transform:translateY(-100%);transition:transform .36s var(--ease);overflow:auto}
.mnav.on{transform:none}
.mnav ul{margin-top:28px;display:grid;gap:4px}
.mnav a{font-family:var(--f-disp);font-size:var(--s-3);text-transform:uppercase;line-height:1.05}

.hero{position:relative;background:var(--ink);color:var(--paper);overflow:hidden}
.hero__m{position:absolute;inset:0}
.hero__m img{width:100%;height:100%;object-fit:cover;object-position:50% 42%;opacity:.6;filter:grayscale(.3) contrast(1.06)}
.hero__m::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(16,16,18,.55) 0%,rgba(16,16,18,.15) 38%,rgba(16,16,18,.85) 100%)}
.hero__in{position:relative;display:grid;align-content:end;gap:clamp(14px,2.2vw,26px);
  min-height:clamp(360px,56vh,680px);padding-block:clamp(36px,5vw,80px)}
.hero__k{display:flex;align-items:center;gap:.7em;color:var(--paper)}
.hero h1{max-width:15ch}
.hero h1 .o{-webkit-text-stroke:1.5px var(--paper);color:transparent}
@supports not (-webkit-text-stroke:1px #fff){.hero h1 .o{color:var(--paper)}}
.hero__s{max-width:42ch;font-size:var(--s-1);color:#DDD9D0}
.hero__c{display:flex;flex-wrap:wrap;gap:12px;margin-top:4px}

.mq{background:var(--rosso);color:#fff;overflow:hidden}
.mq__t{display:flex;width:max-content;animation:mq 30s linear infinite}
.mq__t span{font-family:var(--f-disp);font-size:clamp(20px,3vw,40px);text-transform:uppercase;
  padding:.34em .45em;white-space:nowrap;display:flex;align-items:center;gap:.5em;line-height:1}
@keyframes mq{from{transform:translate3d(0,0,0)}to{transform:translate3d(-50%,0,0)}}
@media (prefers-reduced-motion:reduce){.mq__t{animation:none}}

.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:clamp(20px,2.8vw,40px)}
.grid{display:grid;gap:clamp(14px,1.8vw,26px)}
.g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g2{grid-template-columns:repeat(2,1fr)}
@media (max-width:1040px){.g4{grid-template-columns:repeat(3,1fr)}}
@media (max-width:760px){.g4,.g3{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.g2{grid-template-columns:1fr}}

.card{display:block}
.card__m{position:relative;overflow:hidden;background:var(--paper-2);border:1px solid var(--line);aspect-ratio:4/5}
.card__m svg,.card__m img{width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease)}
.card:hover .card__m svg,.card:hover .card__m img{transform:scale(1.035)}
.flags{position:absolute;left:8px;top:8px;display:grid;gap:5px;z-index:2}
.flag{background:var(--ink);color:var(--paper);font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.13em;padding:.42em .6em;line-height:1}
.flag--r{background:var(--rosso);color:#fff} .flag--o{background:var(--oro);color:var(--ink)}
.card__b{padding-top:12px;display:grid;gap:3px}
.card__t{font-size:var(--s-0);font-weight:600}
.price{font-size:var(--s-0);font-weight:600}
.sw{display:flex;gap:5px;margin-top:6px}
.sw i{width:12px;height:12px;border:1px solid var(--line-2);border-radius:50%;display:block}

.tile{position:relative;display:block;overflow:hidden;border:1px solid var(--line);aspect-ratio:1/1}
.tile svg,.tile img{width:100%;height:100%;object-fit:cover}
.tile__t{position:absolute;left:0;right:0;bottom:0;padding:clamp(12px,1.8vw,22px);
  background:linear-gradient(180deg,rgba(16,16,18,0) 0%,rgba(16,16,18,.55) 45%,rgba(16,16,18,.88) 100%);
  color:var(--paper);text-shadow:0 1px 2px rgba(0,0,0,.45)}

.codice{background:var(--ink);color:var(--paper)}
.codice__in{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(24px,5vw,80px);align-items:center}
@media (max-width:880px){.codice__in{grid-template-columns:1fr}}
.codice__big{width:100%;height:auto;display:block;max-width:520px;margin-inline:auto}
.codice__big text{fill:none;stroke:var(--paper);stroke-width:2.6;stroke-linejoin:round;
  font-family:var(--f-disp),"Arial Narrow",Impact,sans-serif;font-size:110px}
@media (max-width:880px){.codice__big{max-width:340px}}
.codice dl{display:grid;grid-template-columns:auto 1fr;gap:10px 24px;margin-top:26px;border-top:1px solid #33322E;padding-top:22px}
.codice dt{font-size:var(--s--1);text-transform:uppercase;letter-spacing:.14em;color:#9C968A}

.band{position:relative;min-height:clamp(320px,46vw,560px);display:grid;align-items:center;
  background:var(--ink);color:var(--paper);overflow:hidden}
.band img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:80% 16%;opacity:.34}
.band__in{position:relative;padding-block:clamp(44px,6vw,84px)}
.band__in .lead{color:#DAD5CB}

.live{display:grid;grid-template-columns:1fr 1fr;gap:clamp(14px,1.8vw,26px)}
@media (max-width:640px){.live{grid-template-columns:1fr}}
.live figure{margin:0;border:1px solid var(--line);overflow:hidden;background:var(--paper-2)}
.live img{width:100%;aspect-ratio:1/1;object-fit:cover}
.live figcaption{padding:12px 14px;font-size:var(--s--1);text-transform:uppercase;letter-spacing:.13em;color:var(--muted)}

.revs{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(14px,2vw,26px)}
@media (max-width:820px){.revs{grid-template-columns:1fr}}
.rev{border:1px dashed var(--line-2);padding:clamp(18px,2.4vw,28px);background:var(--white);display:grid;gap:10px}
.rev .stars{color:var(--line-2);letter-spacing:.18em;font-size:14px}
.rev p{color:var(--muted)}

.faq{max-width:840px;margin-inline:auto}
.faq details{border-top:1px solid var(--line)}
.faq details:last-of-type{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;padding:1.05em 0;display:flex;gap:16px;align-items:baseline;
  justify-content:space-between;font-weight:600;font-size:var(--s-1)}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-family:var(--f-disp);font-size:1.15em;line-height:1}
.faq details[open] summary::after{content:"–"}
.faq details > div{padding-bottom:1.25em;max-width:68ch;color:var(--muted)}
.todo{color:var(--rosso);font-weight:600}

.nl{background:var(--paper-2);border-block:1px solid var(--line)}
.nl__in{display:grid;grid-template-columns:1fr 1fr;gap:clamp(20px,4vw,60px);align-items:center}
@media (max-width:820px){.nl__in{grid-template-columns:1fr}}
.field{display:flex;border:1px solid var(--ink);background:var(--white)}
.field input{flex:1;border:0;background:transparent;padding:1em 1.1em;min-width:0}
.field input:focus{outline:none}
.field button{background:var(--ink);color:var(--paper);padding:0 1.5em;font-size:var(--s--1);
  font-weight:700;text-transform:uppercase;letter-spacing:.14em}

.ftr{background:var(--ink);color:var(--paper)}
.ftr a:hover{color:var(--oro)}
.ftr__top{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:clamp(20px,3vw,44px);padding-block:clamp(38px,5.5vw,70px)}
@media (max-width:900px){.ftr__top{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.ftr__top{grid-template-columns:1fr}}
.ftr h3{font-size:var(--s--1);text-transform:uppercase;letter-spacing:.16em;color:#9C968A;font-weight:600;margin-bottom:14px}
.ftr li{margin-bottom:8px}
.ftr__wm{font-family:var(--f-disp);font-size:clamp(30px,4vw,46px);line-height:1;margin-bottom:14px}
.ftr__bot{border-top:1px solid #2A2A28;padding-block:20px;display:flex;flex-wrap:wrap;gap:14px;
  justify-content:space-between;font-size:var(--s--1);color:#9C968A}

.crumb{padding-top:18px;font-size:var(--s--1);text-transform:uppercase;letter-spacing:.13em;color:var(--muted)}
.crumb a:hover{color:var(--ink)}
.pdp{display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(24px,4vw,60px);align-items:start;padding-block:clamp(22px,3.4vw,48px)}
@media (max-width:920px){.pdp{grid-template-columns:1fr}}
.gal{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.gal figure{margin:0;border:1px solid var(--line);background:var(--paper-2);overflow:hidden}
.gal figure:first-child{grid-column:1/-1}
.gal svg,.gal img{width:100%;height:100%;object-fit:cover;aspect-ratio:4/5}
.gal figure:first-child svg,.gal figure:first-child img{aspect-ratio:1/1}
.info{position:sticky;top:88px;display:grid;gap:18px}
@media (max-width:920px){.info{position:static}}
.pdp__p{display:flex;gap:12px;align-items:baseline;font-size:var(--s-2);font-weight:600}
.opt{display:grid;gap:9px}
.opt__r{display:flex;flex-wrap:wrap;gap:8px}
.opt__r button{border:1px solid var(--line-2);padding:.62em 1em;font-size:var(--s--1);font-weight:600;
  text-transform:uppercase;letter-spacing:.1em;line-height:1;transition:.18s var(--ease)}
.opt__r button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.opt__r button[disabled]{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.usp{display:grid;gap:8px;font-size:var(--s--1);color:var(--muted)}
.usp li{display:flex;gap:.6em;align-items:baseline}
.usp li::before{content:"—";color:var(--rosso)}
.acc{border-top:1px solid var(--line)}
.acc details{border-bottom:1px solid var(--line)}
.acc summary{list-style:none;cursor:pointer;padding:.95em 0;font-weight:600;display:flex;justify-content:space-between}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";font-family:var(--f-disp)}
.acc details[open] summary::after{content:"–"}
.acc details > div{padding-bottom:1.15em;color:var(--muted)}

.bar{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;
  padding-block:14px;border-block:1px solid var(--line);margin-bottom:clamp(20px,3vw,36px)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{border:1px solid var(--line-2);padding:.55em 1em;font-size:var(--s--1);font-weight:600;
  text-transform:uppercase;letter-spacing:.1em;line-height:1}
.chips button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.bar select{border:1px solid var(--line);background:transparent;padding:.55em .8em;font-size:var(--s--1);
  text-transform:uppercase;letter-spacing:.1em}

.cd{position:fixed;inset:0;z-index:90;visibility:hidden;pointer-events:none}
.cd.on{visibility:visible;pointer-events:auto}
.cd__bd{position:absolute;inset:0;background:rgba(16,16,18,.5);opacity:0;transition:opacity .3s}
.cd.on .cd__bd{opacity:1}
.cd__p{position:absolute;top:0;right:0;height:100%;width:min(440px,100%);background:var(--paper);
  transform:translateX(100%);transition:transform .34s var(--ease);display:flex;flex-direction:column}
.cd.on .cd__p{transform:none}
.cd__h{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
.cd__b{flex:1;overflow:auto;padding:0 20px}
.cd__f{border-top:1px solid var(--line);padding:18px 20px;display:grid;gap:12px}
.row{display:grid;grid-template-columns:76px 1fr auto;gap:14px;align-items:start;padding-block:18px;border-bottom:1px solid var(--line)}
.row .thumb{border:1px solid var(--line);background:var(--paper-2);overflow:hidden}
.row .thumb svg,.row .thumb img{width:100%;aspect-ratio:4/5;object-fit:cover}
.qty{display:inline-flex;border:1px solid var(--line-2);margin-top:8px}
.qty button{width:32px;height:34px;display:grid;place-items:center}
.qty span{min-width:36px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.tot{font-size:var(--s-2);font-weight:600}

.note{background:#191A1C;color:#CFCABE}
.note h2{font-family:var(--f-disp);font-size:var(--s-3);color:#fff;text-transform:uppercase}
.note ul{display:grid;gap:12px;margin-top:20px;max-width:70ch}
.note li{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:baseline}
.note li b{color:#fff;font-weight:600}
.note .n{font-family:var(--f-disp);font-size:18px;color:var(--rosso);line-height:1.2}
.toast{visibility:hidden;position:fixed;left:50%;bottom:24px;transform:translate(-50%,140%);background:var(--ink);color:var(--paper);
  padding:.9em 1.4em;font-size:var(--s--1);font-weight:600;text-transform:uppercase;letter-spacing:.12em;
  z-index:95;transition:transform .3s var(--ease)}
.toast.on{visibility:visible;transform:translate(-50%,0)}
</style>

     +'<figure><img src="'+PH.fold+'" alt=""><figcaption>'+L.live1+'</figcaption></figure>'
     +'<figure><img src="'+PH.beach+'" alt=""><figcaption>'+L.live2+'</figcaption></figure></div></div></section>'+nlBlock();
  return '<div class="wrap"><nav class="crumb"><a href="#/">'+L.home+'</a> / <span style="color:var(--ink)">'+L.contattiT+'</span></nav>'
   +'<div class="sec" style="max-width:760px"><h1 class="disp d4">'+L.contattiT+'</h1>'
   +'<div class="lead mt">'+L.contatti+'</div>'
   +'<p class="mt"><a class="btn" href="https://www.instagram.com/milanof205/" target="_blank" rel="noopener">Instagram</a></p></div></div>'
   +faqBlock();
}
function pCart(){
  var L=t();
  if(!cart.length) return '<div class="wrap sec"><h1 class="disp d4">'+L.cart+'</h1><p class="lead mut mt">'+L.empty+'</p>'
    +'<p class="mt"><a class="btn" href="#/collezione/tutto">'+L.keep+'</a></p></div>';
  return '<div class="wrap sec"><h1 class="disp d4">'+L.cart+'</h1><div class="mt">'+rows()+'</div>'
   +'<div style="display:grid;gap:12px;justify-items:end;padding-top:22px">'
   +'<div class="tot tnum">'+L.sub+' — '+money(total())+'</div>'
   +'<p class="lab" style="text-transform:none;letter-spacing:0">'+L.taxes+'</p>'
   +'<button class="btn" data-checkout>'+L.checkout+'</button></div></div>';
}

/* ---------- cart ---------- */
function count(){ return cart.reduce(function(n,i){return n+i.q;},0); }
function total(){ return cart.reduce(function(n,i){return n+i.q*byH(i.h).price;},0); }
function rows(){
  return cart.map(function(it,idx){
    var p=byH(it.h);
    return '<div class="row"><div class="thumb">'+media(p,it.ci)+'</div>'
     +'<div><a href="#/prodotto/'+p.h+'" style="font-weight:600">'+p.t[lang]+'</a>'
     +'<div class="lab" style="margin-top:4px">'+p.c[it.ci].n+' · '+it.size+'</div>'
     +'<div class="qty"><button data-q="-1" data-i="'+idx+'" aria-label="-">–</button>'
     +'<span>'+it.q+'</span><button data-q="1" data-i="'+idx+'" aria-label="+">+</button></div></div>'
     +'<div class="price tnum">'+money(p.price*it.q)+'</div></div>';
  }).join("");
}
function drawer(){
  var L=t();
  var body = cart.length ? rows()
    : '<p class="mut" style="padding:36px 0">'+L.empty+'</p><a class="btn btn--full" href="#/collezione/tutto" data-close-cart>'+L.keep+'</a>';
  var foot = cart.length ? '<div class="cd__f">'
     +'<div style="display:flex;justify-content:space-between;align-items:baseline"><span class="lab lab--ink">'+L.sub+'</span>'
     +'<span class="tot tnum">'+money(total())+'</span></div>'
     +'<p class="lab" style="text-transform:none;letter-spacing:0">'+L.taxes+'</p>'
     +'<button class="btn btn--full" data-checkout>'+L.checkout+'</button>'
     +'<a class="link-u" style="justify-self:center" href="#/carrello" data-close-cart>'+L.viewCart+'</a></div>' : '';
  return '<div class="cd__h"><span class="lab lab--ink">'+L.cart+' ('+count()+')</span>'
   +'<button class="lab lab--ink" data-close-cart>'+L.close+'</button></div>'
   +'<div class="cd__b">'+body+'</div>'+foot;
}
function toast(msg){
  var el=document.getElementById("toast");
  el.textContent=msg; el.classList.add("on");
  clearTimeout(el._t); el._t=setTimeout(function(){el.classList.remove("on");},2600);
}

/* ---------- router ---------- */
var sel = { ci:0, si:null };
function render(){
  var h = (location.hash||"#/").slice(2).split("/");
  var app = document.getElementById("app");
  document.getElementById("hdr").innerHTML = header();
  document.getElementById("ftr").innerHTML = footer();
  document.getElementById("mnav").innerHTML = mnav();
  document.getElementById("cdp").innerHTML = drawer();
  var L=t();
  document.getElementById("chrome-t").textContent = lang==="it" ? "Anteprima del tema Shopify F205" : "F205 Shopify theme preview";
  document.getElementById("chrome-s").textContent = lang==="it"
    ? "navigazione e carrello funzionano; foto, prezzi e recensioni sono segnaposto."
    : "navigation and cart work; photos, prices and reviews are placeholders.";
  document.body.classList.toggle("has-buybar", h[0]==="prodotto");
  if (h[0]==="collezione") app.innerHTML = pCollection(h[1]||"tutto");
  else if (h[0]==="prodotto") app.innerHTML = pProduct(h[1], sel.ci, sel.si);
  else if (h[0]==="marchio") app.innerHTML = pText("marchio");
  else if (h[0]==="contatti") app.innerHTML = pText("contatti");
  else if (h[0]==="carrello") app.innerHTML = pCart();
  else app.innerHTML = pHome();
}
function go(){ sel={ci:0,si:null}; window.scrollTo(0,0); render(); }
window.addEventListener("hashchange", go);

document.addEventListener("click", function(e){
  var el;
  if ((el=e.target.closest("[data-lang]"))){ lang=el.getAttribute("data-lang"); render(); return; }
  if ((el=e.target.closest("[data-mnav]"))){ document.getElementById("mnav").classList.toggle("on"); return; }
  if ((el=e.target.closest("[data-open-cart]"))){ document.getElementById("cd").classList.add("on"); document.body.style.overflow="hidden"; return; }
  if ((el=e.target.closest("[data-close-cart]"))){ document.getElementById("cd").classList.remove("on"); document.body.style.overflow=""; return; }
  if ((el=e.target.closest("[data-cat]"))){ location.hash="#/collezione/"+el.getAttribute("data-cat"); return; }
  if ((el=e.target.closest("[data-color]"))){ sel.ci=+el.getAttribute("data-color"); render(); return; }
  if ((el=e.target.closest("[data-size]"))){ sel.si=+el.getAttribute("data-size"); render(); return; }
  if ((el=e.target.closest("[data-add]"))){
    if (sel.si == null){
      var opts = document.querySelectorAll(".opt");
      if (opts.length) opts[opts.length-1].scrollIntoView({block:"center", behavior:"smooth"});
      return;
    }
    var h = document.querySelector("[data-pdp]").getAttribute("data-pdp");
    var p = byH(h), size = p.sz[sel.si];
    var found = cart.filter(function(i){return i.h===h && i.ci===sel.ci && i.size===size;})[0];
    if (found) found.q++; else cart.push({h:h, ci:sel.ci, size:size, q:1});
    render();
    document.getElementById("cd").classList.add("on"); document.body.style.overflow="hidden";
    toast(t().added); return;
  }
  if ((el=e.target.closest("[data-q]"))){
    var i=+el.getAttribute("data-i"), d=+el.getAttribute("data-q");
    cart[i].q += d; if (cart[i].q<=0) cart.splice(i,1);
    render(); return;
  }
  if ((el=e.target.closest("[data-checkout]"))){ toast(t().demo); return; }
});
document.addEventListener("change", function(e){
  if (e.target.matches("[data-sort]")){ state.sort=e.target.value; render(); }
});
document.addEventListener("submit", function(e){
  if (e.target.matches("[data-nl]")){
    e.preventDefault();
    var n = e.target.parentNode.querySelector("[data-nl-note]");
    if (n){ n.textContent = t().nlOk; n.style.color = "var(--blu)"; n.style.fontWeight = "600"; }
    e.target.reset();
  }
});
document.addEventListener("keydown", function(e){
  if (e.key==="Escape"){
    document.getElementById("cd").classList.remove("on");
    document.getElementById("mnav").classList.remove("on");
    document.body.style.overflow="";
  }
});

render();
})();
</script>

</body>
</html>
